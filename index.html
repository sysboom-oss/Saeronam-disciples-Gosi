<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>제자훈련 2권 성경고시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 시험지 한 장 폭의 단일 컬럼. 상단 고정 진행 바, 문항 카드 하나, 하단 조작 버튼. */
:root{
  --bg:#EEF1F5; --paper:#FFFFFF; --ink:#1B2433; --muted:#5D6879; --line:#D6DCE5;
  --accent:#2C4878; --accent-ink:#FFFFFF; --accent-soft:#E2E9F4;
  --good:#2B7A4B; --good-soft:#E3F2E8; --bad:#B03838; --bad-soft:#F8E4E4; --warn:#9A660F; --warn-soft:#F7EEDB;
  --display:"Gowun Batang","Nanum Myeongjo","Batang",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11151C; --paper:#1A2029; --ink:#E5E9EF; --muted:#9AA4B3; --line:#2D3542;
  --accent:#93B2E6; --accent-ink:#0F1520; --accent-soft:#1E2A3D;
  --good:#6CC28E; --good-soft:#18291F; --bad:#E78585; --bad-soft:#2E1B1B; --warn:#E0B55C; --warn-soft:#2C2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151C; --paper:#1A2029; --ink:#E5E9EF; --muted:#9AA4B3; --line:#2D3542;
  --accent:#93B2E6; --accent-ink:#0F1520; --accent-soft:#1E2A3D;
  --good:#6CC28E; --good-soft:#18291F; --bad:#E78585; --bad-soft:#2E1B1B; --warn:#E0B55C; --warn-soft:#2C2416; color-scheme:dark}
*{box-sizing:border-box}
body,h1,h2,h3,p,.mode,.rv{word-break:keep-all;overflow-wrap:anywhere}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.eyebrow{font-size:12.5px;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* 시작 화면 */
.head{padding-block:36px 20px;border-bottom:2px solid var(--ink);margin-bottom:24px}
.head h1{font-size:clamp(26px,6vw,36px);line-height:1.3;margin-top:6px}
.head p{margin:10px 0 0;color:var(--muted)}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.group{margin-bottom:26px}
.group>.eyebrow{display:block;margin-bottom:10px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.mode b{font-family:var(--display);font-size:18px}
.mode span{font-size:13.5px;color:var(--muted)}
.mode[aria-pressed="true"]{border:2px solid var(--accent);padding:13px 15px;background:var(--accent-soft)}
.mode:disabled{opacity:.45;cursor:default}
.toggles{display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;color:var(--muted);padding:8px 14px;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row .lbl{min-width:84px;font-size:14px;color:var(--muted)}
.last{font-size:14px;color:var(--muted);margin-top:14px}

/* 문제 화면 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;margin-bottom:14px}
.bar .row{justify-content:space-between}
.count{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.track{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.quit{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 0;text-decoration:underline}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 20px}
.qno{font-family:var(--display);font-size:15px;color:var(--accent);font-weight:700;margin-bottom:6px}
.qtext{font-size:17px;line-height:1.95;word-break:keep-all}
.qtext input{font:inherit;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-bottom:2px solid var(--accent);border-radius:4px 4px 0 0;padding:0 6px;margin:0 2px;max-width:100%;text-align:center}
.qtext input.ok{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.qtext input.no{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.fix{font-size:14px;font-weight:600;color:var(--good);margin-left:2px}
.q{font-family:var(--display);font-size:19px;line-height:1.6;word-break:keep-all}
.ref{font-size:13.5px;color:var(--muted);margin-top:4px}
.items{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.item{display:flex;align-items:center;gap:10px}
.item .n{min-width:52px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.item input,textarea{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.item input.ok{border-color:var(--good);background:var(--good-soft)}
.item input.no{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:140px;margin-top:16px;line-height:1.7;resize:vertical}
.hint{font-size:13.5px;color:var(--muted);margin-top:10px}
.answer{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);font-size:15px;word-break:keep-all}
.answer .eyebrow{display:block;margin-bottom:4px;color:var(--accent)}
.answer ol{margin:0;padding-left:1.3em}
.keys{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.key{font-size:13px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.key.hit{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;margin-top:14px;padding:4px 12px;border-radius:99px}
.v-ok{background:var(--good-soft);color:var(--good)} .v-part{background:var(--warn-soft);color:var(--warn)} .v-no{background:var(--bad-soft);color:var(--bad)}
.self{margin-top:12px}
.self .seg button{padding:7px 12px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.nav .right{display:flex;gap:10px;margin-left:auto}

/* 결과 화면 */
.score{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:30px 18px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.score .big{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:24px;color:var(--muted)}
.pass{font-weight:700;font-size:15px;padding:4px 14px;border-radius:99px}
.breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.bd{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--paper)}
.bd b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.bd span{display:block;font-size:13px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border:1px solid var(--line);border-left-width:4px;border-radius:8px;background:var(--paper);padding:12px 14px;font-size:14.5px;word-break:keep-all}
.rv.s-ok{border-left-color:var(--good)} .rv.s-part{border-left-color:var(--warn)} .rv.s-no{border-left-color:var(--bad)}
.rv .t{font-weight:600}
.rv .mine{color:var(--muted);margin-top:4px}
.rv .cor{margin-top:2px}
.filter{margin-bottom:12px}
/* 암송 문항 */
.memo-ref{font-family:var(--display);font-size:28px;font-weight:700;margin-top:4px;line-height:1.3}
.diffbox{margin-top:14px;padding:14px 16px;border:1px solid var(--line);border-radius:10px}
.dlabel{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:8px}
.diff{font-size:16px;line-height:1.9;word-break:keep-all}
mark{background:none;color:inherit;border-radius:3px;padding:0 1px}
mark.miss{background:var(--bad-soft);color:var(--bad);font-weight:600;text-decoration:underline;text-underline-offset:3px}
mark.extra{background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
.legend{font-size:12.5px;color:var(--muted);margin-top:10px}


/* 인쇄용 문제지 (화면에서는 숨김) */
#sheet{display:none}
.printbox{margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.printbox .btn{margin-top:12px}
@media print{
  @page{size:A4;margin:14mm 15mm 15mm}
  html,body{background:#fff!important;color:#000!important}
  :root{padding:0!important}
  body{padding:0!important;font-size:10.5pt}
  body::before{display:none}
  #app{display:none!important}
  #sheet{display:block;color:#000;font-family:var(--display);font-size:10.5pt;line-height:1.7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #sheet h1{font-size:19pt;margin:2mm 0 3mm;text-align:center}
  .phead{border-bottom:1.5pt solid #000;padding-bottom:3mm;margin-bottom:4mm}
  .ptop{display:flex;justify-content:space-between;font-family:var(--body);font-size:8.5pt;color:#333}
  .pmeta{display:flex;justify-content:space-between;gap:6mm;font-family:var(--body);font-size:10pt}
  .pmeta i{display:inline-block;width:32mm;border-bottom:.6pt solid #000;margin:0 1mm}
  .psec h2{font-size:12pt;margin:5mm 0 2mm;padding:1mm 2mm;background:#eef0f3;border-left:3pt solid #000;break-after:avoid}
  .psec h2 small,.ph small{font-weight:400;font-size:9pt;color:#333}
  .plist{list-style:none;margin:0;padding:0}
  .pq{display:flex;gap:2mm;margin:0 0 3.2mm;break-inside:avoid}
  .pn{flex:0 0 7mm;font-weight:700;text-align:right}
  .pb{flex:1;min-width:0}
  .pt{word-break:keep-all;line-height:2.15}
  .pbk{display:inline-block;border-bottom:.7pt solid #000;height:1em;vertical-align:-1px;margin:0 1mm;max-width:100%}
  .ph{font-weight:700;word-break:keep-all}
  .pl{border-bottom:.5pt solid #777;height:8mm}
  .pitems{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm}
  .pitems.many{grid-template-columns:1fr 1fr 1fr}
  .pi{display:flex;align-items:flex-end;gap:1.5mm}
  .pi span{font-size:9.5pt;white-space:nowrap;padding-bottom:1mm}
  .pi .pl{flex:1}
  .pkey{break-before:page;font-family:var(--body);font-size:9pt;line-height:1.55}
  .pkey h2{font-family:var(--display);font-size:14pt;border-bottom:1.5pt solid #000;padding-bottom:2mm;margin:0 0 3mm}
  .klist{list-style:none;margin:0;padding:0;column-count:2;column-gap:7mm}
  .klist li{break-inside:avoid;margin-bottom:1.6mm;word-break:keep-all}
}

/* 휴대폰 최적화 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn,.mode,.seg button{min-height:44px}
.item input{min-height:44px;font-size:16px}
textarea{font-size:16px}
@media (max-width:560px){
  body{font-size:15.5px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
  .head{padding-block:24px 16px;margin-bottom:18px}
  .head p{font-size:14.5px}
  .modes{grid-template-columns:1fr 1fr;gap:8px}
  .mode{padding:12px}
  .mode[aria-pressed="true"]{padding:11px}
  .mode b{font-size:16px}
  .mode span{font-size:12.5px}
  .row .lbl{min-width:0;width:100%}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:8px 6px;font-size:14px}
  #go{width:100%}
  .card{padding:18px 14px;border-radius:10px}
  .qtext{font-size:16.5px;line-height:2.05}
  .qtext input{font-size:16px}
  .q{font-size:17.5px}
  .item{gap:8px}
  .item .n{min-width:34px;font-size:13px}
  .answer{padding:12px 13px;font-size:14.5px}
  /* 이전·정답확인·다음 버튼을 엄지가 닿는 화면 하단에 고정 */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;flex-wrap:nowrap;
    background:var(--bg);border-top:1px solid var(--line);
    padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .nav .right{flex:1}
  .nav .right .btn{flex:1}
  #prev{flex:0 0 auto}
  .nav.static{position:static;border:0;padding:0;flex-wrap:wrap}
  .nav.static .btn{flex:1 1 100%}
  .score{padding-block:22px 14px}
  .score .big{font-size:60px}
  .breakdown{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .breakdown .bd{padding:8px 10px}
  .bd b{font-size:19px}
  .rv{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet" aria-hidden="true"></div>

<script>
/* ───────── 문제 데이터 (족보 원문 그대로) ───────── */
const BLANK=[
"성경은 살아 계신 하나님의 말씀이다. 우리는 성경이 특별한 [[권위]]가 있는 것처럼 보이도록 애를 쓰거나 장황하게 변명할 필요가 없다. 왜냐하면 성경은 그 자체로 아무도 허물 수 없는 [[권위]]를 가지고 있기 때문이다.",
"성경은 모두 성령의 [[영감]]으로 기록된 진리로서 거짓이나 잘못이 하나도 없다. 신구약 66권은 [[최종적|최종]]인 계시이며, 그 이상의 계시는 존재하지 않는다. 성경은 인간을 구원하고 하나님의 뜻을 따라 거룩한 생활을 하게 하는 규범으로서 [[온전]]하며 [[충분]]하다.",
"우리가 성경의 권위를 받아들이는 궁극적인 이유는 주 예수 그리스도의 권위에 기꺼이 [[순종]]할 수 있기 때문이다.",
"하나님은 오직 한 분이시며 참 신이시다. 하나님 외에 다른 것을 섬기는 것은 [[우상]]이다. 하나님은 창조자시며 섭리자시며 통치자시다. 인간은 하나님께 경배하고, 감사하고, 사랑하고, 순종할 뿐이다. 하나님을 잘 알고 많이 아는 것은 우리 마음을 더욱 [[겸손]]하게 하며, 큰 용기와 위로를 얻게 한다.",
"예수님의 [[신성]]과 [[인성]]은 구원자로서의 절대 조건이다.",
"하나님은 한 분이시다. 하나님은 성부와 성자와 성령, 삼위로 계신다. 삼위 하나님은 그 본질과 능력과 영광이 [[동등]]하시다. 성부는 영원 자존자이시다. 성자는 영원토록 성부에게서 탄생하신다. 성령은 영원토록 성부와 성자에게서 나오신다. 삼위 중 한 분이라도 부인하면 하나님을 모두 부인하는 것이 된다.",
"모든 후손이 아담의 범죄에 동참했다는 가장 좋은 증거는 인간으로 태어나는 사람이 전부 죄를 짓는 [[본성]]을 갖고 있다는 점이다. 타락한 인간은 자신의 힘으로 하나님을 찾을 수 없고, 하나님이 원하시는 선을 행할 수 없다. 인간은 [[구원자]]를 절대적으로 필요로 하는 존재다.",
"[[은혜]]란 당신의 공로로 얻을 수 있는 것도 아니요, 당신의 무공로로 잃어버릴 수 있는 것도 아니다. [[은혜]]는 우리의 잘잘못을 따지지 않고 주시는 선물이다.",
"예수님은 삼일 만에 완전한 육체를 가지고 [[부활]]하셨다. 그가 부활하심으로 인류가 구원받을 수 있는 길이 마련되었다. 부활하신 예수님은 만왕의 왕이요, 만유의 주가 되셨다. 그는 지금 하나님 우편에 계시면서 [[재림]]을 준비하고 계신다. 예수님의 부활은 우리 자신의 부활을 보증하는 첫 열매가 되었다. 기독교는 부활 신앙과 함께 서고 쓰러진다. 예수님의 부활을 부인하는 자는 불신자가 아니면 [[이단]]이다.",
"구약 시대와는 달리 오순절 이후에는 예수님을 믿으면 한 사람도 예외 없이 [[성령]]의 선물을 받을 수 있는 은혜의 시대가 되었다. 성령에 대해 성경적으로 올바르게 이해하는 것은 대단히 중요하다. 어떤 [[체험]]보다 말씀의 가르침을 가지고 정확히 아는 것이 앞서지 않으면 안 된다.",

const IGN=/[\s.,·()\[\]'"“”‘’\-–~!?/:;]/;

const rnd=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function makeBlank(v){
  const w=stripNo(v.x).trim().split(/\s+/);
  const cand=rnd(w.map((_,i)=>i).filter(i=>w[i].length>=2));
  const cnt=w.length>=14?4:3,pick=[];
  for(const i of cand){if(pick.length>=cnt)break;if(!pick.some(p=>Math.abs(p-i)<2))pick.push(i)}
  for(const i of cand){if(pick.length>=cnt)break;if(!pick.includes(i))pick.push(i)}
  return {id:"mb"+v.n,sec:"암송",t:"blank",v,title:verseTitle(v),
    text:w.map((x,i)=>pick.includes(i)?`[[${x}]]`:x).join(" ")}}
function pickVerses(k,exclude,recent){
  const pool=VERSES.filter(v=>!exclude.includes(v.n));
  const fresh=rnd(pool.filter(v=>!recent.includes(v.n))),rest=rnd(pool.filter(v=>recent.includes(v.n)));
  return fresh.concat(rest).slice(0,k)}
function memoSet(){
  const recent=store.get("g2-recent",[]);
  const full=pickVerses(2,[],recent),bl=pickVerses(2,full.map(v=>v.n),recent);
  store.set("g2-recent",[...full,...bl].map(v=>v.n).concat(recent).slice(0,12));
  return [...full.map(makeFull),...bl.map(makeBlank)]}
const numberMemo=list=>{let k=0;list.forEach(q=>{if(q.sec==="암송")q.no=++k});return list};

/* 글자 비교(LCS): 틀린 곳 표시용 */
function lcsMarks(a,b){const n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ma=new Array(n).fill(false),mb=new Array(m).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){ma[i]=mb[j]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return {ma,mb,len:dp[0][0]}}
function diffParts(user,ans){
  const u=stripNo(user),x=stripNo(ans);
  const ua=[...u].filter(c=>!IGN.test(c)),xa=[...x].filter(c=>!IGN.test(c));
  const {ma,mb,len}=lcsMarks(ua,xa);
  const paint=(s,marks,cls)=>{let k=0,out="";for(const c of s){if(IGN.test(c)){out+=esc(c);continue}
    out+=marks[k++]?esc(c):`<mark class="${cls}">${esc(c)}</mark>`}return out};
  return {userHTML:paint(u,ma,"extra"),ansHTML:paint(x,mb,"miss"),match:len,total:xa.length}}

/* ───────── 채점 도구 ───────── */
const norm=s=>(s||"").replace(/[\s.,·()\[\]'"“”‘’\-–~!?/]/g,"").toLowerCase();
function parseBlank(text){const parts=[];const re=/\[\[(.+?)\]\]/g;let last=0,m;
  while((m=re.exec(text))){parts.push({s:text.slice(last,m.index)});parts.push({b:m[1].split("|")});last=re.lastIndex}
  parts.push({s:text.slice(last)});return parts}
const blankOk=(v,alts)=>alts.some(a=>norm(v)===norm(a));
function optMatch(v,opt){const n=norm(v);if(!n)return false;
  if(typeof opt==="string"){const o=norm(opt);return n===o||n.includes(o)}
  return opt.all.every(k=>n.includes(norm(k)))}
const itemMatch=(v,item)=>item.some(o=>optMatch(v,o));
function gradeList(q,vals){const n=q.items.length;const res=new Array(n).fill(false);
  if(q.ordered){vals.forEach((v,i)=>res[i]=itemMatch(v,q.items[i]));return res}
  /* 순서 무관: 이분 매칭 */
  const owner=new Array(n).fill(-1);
  function tryIn(i,seen){for(let j=0;j<n;j++){if(seen[j]||!itemMatch(vals[i],q.items[j]))continue;seen[j]=true;
    if(owner[j]<0||tryIn(owner[j],seen)){owner[j]=i;return true}}return false}
  for(let i=0;i<n;i++)tryIn(i,[]);
  owner.forEach(i=>{if(i>=0)res[i]=true});return res}
function essayHits(q,v){const n=norm(v);return q.keys.map(k=>n.includes(norm(k)))}
function suggest(r){return r>=.7?1:r>=.35?.5:0}

function grade(q,ans){ans=ans||{};
  if(q.t==="blank"){const parts=parseBlank(q.text).filter(p=>p.b);const v=ans.v||[];
    const marks=parts.map((p,i)=>blankOk(v[i],p.b));return {marks,score:marks.filter(Boolean).length/marks.length}}
  if(q.t==="list"){const v=ans.v||[];const marks=gradeList(q,v);return {marks,score:marks.filter(Boolean).length/marks.length}}
  if(q.t==="memo"){const ok=normV(ans.text)===normV(q.v.x);return {score:ok?1:0}}
  const hits=essayHits(q,ans.text);const sug=suggest(hits.filter(Boolean).length/hits.length);
  return {hits,sug,score:ans.self!=null?ans.self:sug}}

function start(){

function buildList(shuffle){
  let list;const wrong=store.get("g2-wrong",[]);
  if(S.mode==="all")list=ALL.concat(memoSet());
  else if(S.mode==="memo")list=rnd(VERSES).map(makeFull);

      if(m){const v=VERSES.find(x=>x.n===+m[2]);return v?(m[1]==="f"?makeFull(v):makeBlank(v)):null}
      return ALL.find(q=>q.id===id)}).filter(Boolean).sort((a,b)=>(a.sec==="암송")-(b.sec==="암송"));

const lines=n=>Array.from({length:n},()=>`<div class="pl"></div>`).join("");
function sheetBlank(text){return parseBlank(text).map(p=>p.s!=null?esc(p.s):
  `<span class="pbk" style="width:${Math.max(4,p.b[0].length*1.15+2)}em"></span>`).join("")}
function sheetItem(q,n){

function fillSheet(withKey){

function answerBox(q){

function showFeedback(q){

    const parts=parseBlank(q.text).filter(p=>p.b);

      (g.score<1?`<div class="diffbox"><span class="eyebrow">글자 비교 · ${d.total}자 중 ${d.match}자 일치</span>
        <div class="dlabel">내 답</div><div class="diff">${d.userHTML.trim()||"(빈칸)"}</div>
        <div class="dlabel">정답</div><div class="diff">${d.ansHTML}</div>
        <div class="legend"><mark class="extra">노란 줄</mark> 정답에 없는 글자 · <mark class="miss">빨간 글자</mark> 빠지거나 틀린 글자</div></div>`
       :`<div class="answer"><span class="eyebrow">본문 · ${esc(q.v.r)}</span>${esc(q.v.x)}</div>`)+
      `<div class="hint">핵심 고리: ${esc(q.v.k)}${q.v.c?` · ${esc(q.v.c)}`:""}</div>`;

    fb.innerHTML=verdict(g.score)+answerBox(q);
  }else{
    app.querySelector("textarea").readOnly=true;
    const cur=a.self!=null?a.self:g.sug;
    fb.innerHTML=answerBox(q)+`<div class="keys">${q.keys.map((k,i)=>`<span class="key ${g.hits[i]?"hit":""}">${esc(k)}</span>`).join("")}</div>
      <div class="self row"><span class="lbl">스스로 채점</span><div class="seg">
      ${[[1,"맞음"],[.5,"부분"],[0,"틀림"]].map(([v,t])=>`<button data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join("")}</div></div>`;
    fb.querySelectorAll(".self button").forEach(b=>b.onclick=()=>{a.self=+b.dataset.v;showFeedback(q)});
  }
}

/* ───────── 결과 화면 ───────── */
function userText(q,a){a=a||{};if(q.t==="essay"||q.t==="memo")return a.text||"";return (a.v||[]).map(x=>x||"—").join(" / ")}
function correctText(q){if(q.t==="memo")return q.v.x;if(q.t==="blank")return parseBlank(q.text).filter(p=>p.b).map(p=>p.b[0]).join(" / ");
  return (Array.isArray(q.a)?q.a:[q.a]).join(" / ")}
let filterWrong=false;
function finish(){
  const rows=S.list.map(q=>({q,g:grade(q,S.ans[q.id])}));
  const total=rows.reduce((s,r)=>s+r.g.score,0);
  const score=Math.round(total/rows.length*100);
  const wrong=rows.filter(r=>r.g.score<1).map(r=>r.q.id);
  const labels={all:"실전 모의고사",memo:"암송 구절",blank:"괄호 문제",short:"단답·서술형",bonus:"보너스 퀴즈",wrong:"틀린 문제"};
  store.set("g2-wrong",wrong);
  const d=new Date();store.set("g2-last",{score,label:labels[S.mode],date:`${d.getMonth()+1}월 ${d.getDate()}일`});
  const pass=score>=60;
  const bySec=SECS.map(s=>{const r=rows.filter(x=>x.q.sec===s);if(!r.length)return "";
    const ok=r.filter(x=>x.g.score>=1).length;return `<div class="bd"><span>${s}</span><b>${ok} / ${r.length}</b><span>문항 완전 정답</span></div>`}).join("");
  const essays=rows.filter(r=>r.q.t==="essay"&&S.ans[r.q.id]?.self==null).length;
  app.innerHTML=`
  <div class="score"><div><div class="eyebrow">${esc(labels[S.mode])} 결과</div>
    <div class="big">${score}<small> / 100</small></div></div>
    <span class="pass ${pass?"v-ok":"v-no"}">${pass?"합격선 통과":"재시험 범위 · 60점 미만"}</span></div>
  <div class="breakdown">${bySec}</div>
  ${essays?`<p class="hint">서술형 ${essays}문항은 핵심어 비율로 임시 채점했습니다. 아래에서 맞음·부분·틀림을 고르면 점수가 바로 바뀝니다.</p>`:""}
  <div class="nav static" style="margin-bottom:18px;margin-top:0">
    <button class="btn primary" id="retry" ${wrong.length?"":"disabled"}>틀린 문제 다시 풀기 (${wrong.length})</button>
    <button class="btn" id="home">처음으로</button></div>
  <div class="row filter"><span class="eyebrow">문항별 확인</span><div class="seg" id="segF">
    <button data-v="0" aria-pressed="${!filterWrong}">전체</button><button data-v="1" aria-pressed="${filterWrong}">틀린 것만</button></div></div>
  <div class="review">${rows.filter(r=>!filterWrong||r.g.score<1).map(({q,g})=>{
    const cls=g.score>=1?"s-ok":g.score>0?"s-part":"s-no";
    const head=q.t==="memo"?`암송 ${q.no}번 · ${verseTitle(q.v)} 전문 쓰기`:q.t==="blank"?(q.v?`암송 ${q.no}번 · ${q.title} 빈칸`:(q.title||`괄호 ${q.no}번`)):`${q.sec} ${q.no}번 · ${q.q}`;
    return `<div class="rv ${cls}"><div class="t">${esc(head)}</div>
      <div class="mine">내 답: ${esc(userText(q,S.ans[q.id])||"(빈칸)")}</div>
      <div class="cor">정답: ${esc(correctText(q))}</div>
      ${q.t==="essay"?`<div class="self row"><div class="seg">${[[1,"맞음"],[.5,"부분"],[0,"틀림"]].map(([v,t])=>`<button data-id="${q.id}" data-v="${v}" aria-pressed="${g.score===v}">${t}</button>`).join("")}</div></div>`:""}
    </div>`}).join("")}</div>`;
  scrollTo(0,0);
  document.getElementById("home").onclick=()=>{filterWrong=false;home();scrollTo(0,0)};
  document.getElementById("retry").onclick=()=>{filterWrong=false;S.mode="wrong";start()};
  app.querySelectorAll("#segF button").forEach(b=>b.onclick=()=>{filterWrong=b.dataset.v==="1";finish()});
  app.querySelectorAll(".rv .self button").forEach(b=>b.onclick=()=>{(S.ans[b.dataset.id]||(S.ans[b.dataset.id]={})).self=+b.dataset.v;finish()});
}

home();
</script>

</body>
